services:
  db:
    image: postgres:16
    container_name: incident_db
    restart: always
    environment:
      POSTGRES_USER: postg
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: incidentdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: